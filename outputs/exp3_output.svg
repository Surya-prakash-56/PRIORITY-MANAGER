  <!-- Left Pane: Matrix -->
  <rect x="20" y="65" width="240" height="275" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="35" y="95" fill="#818CF8" font-family="sans-serif" font-size="12" font-weight="bold">EISENHOWER MATRIX</text>
  
  <rect x="35" y="115" width="210" height="42" rx="8" fill="#0F172A" stroke="#EF4444" stroke-opacity="0.3"/>
