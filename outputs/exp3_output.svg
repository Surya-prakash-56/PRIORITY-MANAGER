  <rect x="610" y="80" width="55" height="24" rx="6" fill="#EF4444" fill-opacity="0.15"/>
  <text x="637" y="96" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Urgent</text>

  <rect x="280" y="130" width="400" height="55" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4"/>
  <circle cx="305" cy="157" r="5" fill="#F59E0B"/>
  <text x="325" y="161" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Design Database Schema for v2</text>
