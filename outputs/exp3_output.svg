<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <rect width="700" height="360" rx="14" fill="#0F172A"/>
  <!-- App Header -->
  <rect x="0" y="0" width="700" height="50" rx="14" fill="#1E293B"/>
