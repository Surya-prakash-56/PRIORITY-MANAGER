  <text x="45" y="245" fill="#3B82F6" font-family="sans-serif" font-size="11" font-weight="bold">Delegate (Urgent/Low): 4</text>

  <rect x="35" y="271" width="210" height="42" rx="8" fill="#0F172A" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="45" y="297" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="bold">Eliminate (Backlog): 2</text>

  <!-- Right Pane: Tasks List -->
  <rect x="280" y="65" width="400" height="55" rx="12" fill="#1E293B" stroke="#EF4444" stroke-opacity="0.4"/>
