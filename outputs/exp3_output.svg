  <text x="637" y="161" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">High</text>

  <rect x="280" y="195" width="400" height="55" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4"/>
