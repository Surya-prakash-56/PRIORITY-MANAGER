<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <rect width="700" height="380" rx="14" fill="#0F172A"/>
  <!-- App Header -->
  <rect x="0" y="0" width="700" height="55" rx="14" fill="#1E293B"/>
  
  <!-- Section 1: Row Layout -->
  <text x="30" y="85" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">ACTIVE LOAD OVERVIEW (Row Layout)</text>
  
  <rect x="30" y="100" width="145" height="75" rx="12" fill="#1E293B" stroke="#EF4444" stroke-opacity="0.4"/>
  <text x="102" y="135" fill="#EF4444" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">4</text>
  <text x="102" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Urgent (P1)</text>

  <rect x="195" y="100" width="145" height="75" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4"/>
  <text x="267" y="135" fill="#F59E0B" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">6</text>
  <text x="267" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">High (P2)</text>

  <rect x="360" y="100" width="145" height="75" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4"/>
  <text x="432" y="135" fill="#3B82F6" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">8</text>
  <text x="432" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Medium (P3)</text>

  <rect x="525" y="100" width="145" height="75" rx="12" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="597" y="135" fill="#10B981" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">3</text>
  <text x="597" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Low (P4)</text>

  <!-- Section 2: Stack Layout -->
  <text x="30" y="215" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">FEATURED PRIORITY ITEM (Stack Layering)</text>
  
  <rect x="30" y="235" width="640" height="115" rx="16" fill="#1E293B" stroke="#EF4444" stroke-opacity="0.5"/>
  <text x="55" y="275" fill="#F8FAFC" font-family="sans-serif" font-size="17" font-weight="bold">Deploy Hotfix for Auth Session Timeout</text>
  <text x="55" y="300" fill="#94A3B8" font-family="sans-serif" font-size="13">Token expiration edge case causes mobile app session drop on backgrounding.</text>
  
  <rect x="55" y="315" width="100" height="24" rx="6" fill="#334155"/>
  <text x="105" y="331" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">⏱️ ETA: 45 mins</text>
  
  <text x="645" y="332" fill="#EF4444" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">⚠️ Due in 2 hours</text>

  <!-- Stack Overlay Badge -->
  <rect x="540" y="223" width="115" height="24" rx="12" fill="#EF4444"/>
  <text x="597" y="239" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">P1 · URGENT</text>
</svg>
