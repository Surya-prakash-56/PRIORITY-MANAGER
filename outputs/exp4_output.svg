<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <rect width="700" height="360" rx="14" fill="#0F172A"/>
  <!-- App Header -->
  <rect x="0" y="0" width="700" height="50" rx="14" fill="#1E293B"/>
  
  <!-- Screen Mockup 1: Dashboard -->
  <rect x="25" y="70" width="310" height="260" rx="12" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="25" y="70" width="310" height="36" rx="12" fill="#334155"/>
  <text x="40" y="93" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Route: '/' (Priority Dashboard)</text>

  <rect x="40" y="120" width="280" height="50" rx="8" fill="#0F172A"/>
  <text x="52" y="142" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Refactor Payment Microservice</text>
  <text x="52" y="158" fill="#EF4444" font-family="sans-serif" font-size="10">P1 Urgent · Tap to inspect &gt;</text>

  <rect x="40" y="180" width="280" height="50" rx="8" fill="#0F172A"/>
  <text x="52" y="202" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Design Dark Mode Tokens</text>
  <text x="52" y="218" fill="#F59E0B" font-family="sans-serif" font-size="10">P2 High · Tap to inspect &gt;</text>

  <rect x="40" y="240" width="280" height="50" rx="8" fill="#0F172A"/>
  <text x="52" y="262" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Weekly Backlog Grooming</text>
  <text x="52" y="278" fill="#3B82F6" font-family="sans-serif" font-size="10">P3 Medium · Tap to inspect &gt;</text>

  <!-- Navigation Arrow -->
  <path d="M 345 190 L 375 190 M 365 180 L 375 190 L 365 200" stroke="#818CF8" stroke-width="2.5" fill="none"/>

  <!-- Screen Mockup 2: Details -->
  <rect x="385" y="70" width="290" height="260" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="385" y="70" width="290" height="36" rx="12" fill="#334155"/>
  <text x="400" y="93" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Route: '/details' (Inspecting P1)</text>

  <rect x="405" y="120" width="100" height="22" rx="6" fill="#EF4444" fill-opacity="0.2"/>
  <text x="455" y="135" fill="#EF4444" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PRIORITY: URGENT</text>

  <text x="405" y="165" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Refactor Payment Microservice</text>
  <text x="405" y="190" fill="#94A3B8" font-family="sans-serif" font-size="11">Fix race condition during concurrent</text>
  <text x="405" y="206" fill="#94A3B8" font-family="sans-serif" font-size="11">webhook processing on checkout.</text>

  <rect x="405" y="260" width="250" height="40" rx="10" fill="#6366F1"/>
  <text x="530" y="285" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&lt; Back to Dashboard (pop)</text>
</svg>
