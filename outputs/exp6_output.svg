<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <rect width="700" height="360" rx="14" fill="#0F172A"/>
  <!-- App Header -->
  <rect x="0" y="0" width="700" height="50" rx="14" fill="#1E293B"/>
  <rect x="620" y="14" width="60" height="24" rx="12" fill="#6366F1"/>
  <text x="650" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🌙 DARK</text>

  <!-- Custom Widget 1: PriorityHeaderWidget -->
  <rect x="30" y="70" width="640" height="70" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="50" y="100" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold">Q4 Product Roadmap Delivery (PriorityHeaderWidget)</text>
  <text x="50" y="122" fill="#94A3B8" font-family="sans-serif" font-size="12">Critical deliverables assigned to engineering and design pods.</text>

  <!-- Custom Widget 2: PriorityCustomCard Urgent -->
  <rect x="30" y="155" width="640" height="55" rx="12" fill="#1E293B" stroke="#EF4444" stroke-opacity="0.4"/>
  <circle cx="50" cy="182" r="5" fill="#EF4444"/>
  <text x="70" y="186" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Payment Gateway Stripe Integration (PriorityCustomCard)</text>
  <rect x="580" y="170" width="75" height="24" rx="8" fill="#EF4444" fill-opacity="0.15"/>
  <text x="617" y="186" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">URGENT</text>

  <!-- Custom Widget 2: PriorityCustomCard High -->
  <rect x="30" y="220" width="640" height="55" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4"/>
  <circle cx="50" cy="247" r="5" fill="#F59E0B"/>
  <text x="70" y="251" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Design Design System Tokens in Figma</text>
  <rect x="580" y="235" width="75" height="24" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
  <text x="617" y="251" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HIGH</text>

  <!-- Custom Widget 2: PriorityCustomCard Medium -->
  <rect x="30" y="285" width="640" height="55" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4"/>
  <circle cx="50" cy="312" r="5" fill="#3B82F6"/>
  <text x="70" y="316" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Weekly Knowledge Sharing Presentation</text>
  <rect x="580" y="300" width="75" height="24" rx="8" fill="#3B82F6" fill-opacity="0.15"/>
  <text x="617" y="316" fill="#3B82F6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MEDIUM</text>
</svg>
