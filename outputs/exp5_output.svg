<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <rect width="700" height="360" rx="14" fill="#0F172A"/>
  <!-- App Header -->
  <rect x="0" y="0" width="700" height="50" rx="14" fill="#1E293B"/>
  
  <!-- Counter Card -->
  <rect x="30" y="70" width="640" height="90" rx="16" fill="#1E293B" stroke="#6366F1" stroke-opacity="0.4"/>
  <text x="135" y="112" fill="#818CF8" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">18</text>
  <text x="135" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Total Tasks</text>

  <line x1="240" y1="85" x2="240" y2="145" stroke="#334155" stroke-width="1"/>

  <text x="350" y="112" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">12</text>
  <text x="350" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Resolved Tasks</text>

  <line x1="460" y1="85" x2="460" y2="145" stroke="#334155" stroke-width="1"/>

  <text x="565" y="112" fill="#EF4444" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">4</text>
  <text x="565" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Urgent Active</text>

  <!-- Reactive Task Items with Checkbox -->
  <rect x="30" y="180" width="640" height="46" rx="10" fill="#1E293B"/>
  <rect x="45" y="193" width="18" height="18" rx="4" fill="#6366F1"/>
  <path d="M 49 202 L 53 206 L 60 197" stroke="#FFF" stroke-width="2" fill="none"/>
  <text x="75" y="209" fill="#94A3B8" font-family="sans-serif" font-size="13" text-decoration="line-through">Submit College Lab Record</text>
  <text x="645" y="209" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">RESOLVED</text>

  <rect x="30" y="235" width="640" height="46" rx="10" fill="#1E293B"/>
  <rect x="45" y="248" width="18" height="18" rx="4" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="75" y="264" fill="#F8FAFC" font-family="sans-serif" font-size="13">Code Review Authentication PR</text>
  <text x="645" y="264" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">URGENT</text>

  <rect x="30" y="290" width="640" height="46" rx="10" fill="#1E293B"/>
  <rect x="45" y="303" width="18" height="18" rx="4" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="75" y="319" fill="#F8FAFC" font-family="sans-serif" font-size="13">Design Weekly Sprint Backlog</text>
  <text x="645" y="319" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">HIGH</text>
